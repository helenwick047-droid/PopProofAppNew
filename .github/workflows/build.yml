name: Flutter Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Best Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9' # 🔥 Sabse best stable version lock kiya hai for overlay compatibility
          channel: 'stable'
          cache: true

      - name: Auto-Generate Clean Android Project Structure
        run: |
          # 1. Cloud par compatible release project ready karna
          flutter create --org com.popproof.security clean_app
          
          # 2. Files replace aur injection sequence execute karna
          rm -rf clean_app/lib
          cp -r lib clean_app/
          cp android/app/src/main/AndroidManifest.xml clean_app/android/app/src/main/AndroidManifest.xml
          
          # 3. Safe explicitly packages load karna
          cd clean_app
          flutter pub add http flutter_overlay_window shared_preferences
          flutter pub get
          
          # 4. Final APK compilation
          flutter build apk --debug
          
          # 5. Delivery path structuring
          cd ..
          mkdir -p build/app/outputs/flutter-apk/
          cp clean_app/build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Clean Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: PopProof-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
