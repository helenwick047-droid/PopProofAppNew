name: Flutter Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Modern Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # 🔥 Latest stable compiler standard
          channel: 'stable'
          cache: true

      - name: Compile Official Repository Base Directly
        run: |
          # 1. Cloud par fresh working base layout ready karna
          flutter create --org com.pop.proof clean_app
          
          # 2. Workspace structure management mapping
          rm -rf clean_app/lib
          rm -f clean_app/pubspec.yaml
          
          cp -r lib clean_app/
          cp pubspec.yaml clean_app/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml clean_app/android/app/src/main/AndroidManifest.xml
          
          # 3. Direct fetch packages and compile standard application 
          cd clean_app
          flutter pub get
          flutter build apk --debug
          
          # 4. Safe forwarding artifact path
          cd ..
          mkdir -p build/app/outputs/flutter-apk/
          cp clean_app/build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Clean Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: PopProof-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
