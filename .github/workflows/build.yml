name: Flutter Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Specific Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9' # 🔥 Fixed compilation version to bypass plugin v1 errors
          channel: 'stable'
          cache: true

      - name: Build Protected APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
